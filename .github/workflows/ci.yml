name: Validate simulation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests_python -p 'test_engine*.py' -v
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/humanity-wheels
  desktop-bridge:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-desktop.txt -e .
      - run: python -m unittest discover -s tests_python -p test_desktop.py -v
