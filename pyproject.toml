[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "humanity-sh"
version = "0.3.0"
description = "A Python society simulation with a PySide6 and HTML observatory"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Pedram Asgari"}]
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]

[project.scripts]
humanity = "humanity.cli:main"
humanity-desktop = "humanity.desktop.app:main"

[tool.setuptools.packages.find]
include = ["humanity*"]

[tool.setuptools.package-data]
"humanity.data" = ["*.json"]
